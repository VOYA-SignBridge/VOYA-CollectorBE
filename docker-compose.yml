# version removed (obsolete in modern Compose)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sign_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://signuser:signpass@postgres:5432/signdb
      - DATASET_ROOT=/dataset
      - RESIZE_W=480
      - RESIZE_H=480
      - AUG_PER_SEQ=2
      - VIDEO_AUG_PER_SEQ=8
      - VIDEO_COMPLETENESS=0.8
      - SPEED_VARIANTS=1.0
      # Disable per-class cap so video uploads can keep generating samples
      - MAX_SAMPLES_PER_CLASS=0

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sign_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
    depends_on:
      - redis
      - postgres
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://signuser:signpass@postgres:5432/signdb
      - DATASET_ROOT=/dataset
      - RESIZE_W=480
      - RESIZE_H=480
      - AUG_PER_SEQ=2
      - VIDEO_AUG_PER_SEQ=8
      - VIDEO_COMPLETENESS=0.8
      - SPEED_VARIANTS=1.0
      # Disable per-class cap so video uploads can keep generating samples
      - MAX_SAMPLES_PER_CLASS=0

  minio:
    image: minio/minio:latest
    container_name: sign_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  postgres:
    image: postgres:15
    container_name: sign_postgres
    environment:
      - POSTGRES_USER=signuser
      - POSTGRES_PASSWORD=signpass
      - POSTGRES_DB=signdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql


  redis:
    image: redis:6.2
    container_name: sign_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
  dataset:
