# version removed (obsolete in modern Compose)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sign_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./.env.example
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
      - ./models:/models
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sign_worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - ./.env.example
    volumes:
      - ./backend:/app
      - ./dataset:/dataset
      - ./models:/models
    depends_on:
      - redis
      - postgres

  minio:
    image: minio/minio:latest
    container_name: sign_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  postgres:
    image: postgres:15
    container_name: sign_postgres
    environment:
      - POSTGRES_USER=signuser
      - POSTGRES_PASSWORD=signpass
      - POSTGRES_DB=signdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql


  redis:
    image: redis:6.2
    container_name: sign_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:

